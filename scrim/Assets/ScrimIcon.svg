<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="scrimIconTitle scrimIconDescription">
    <title id="scrimIconTitle">Scrim app icon</title>
    <desc id="scrimIconDescription">A white theater scrim with the FreeShow logo projected onto its folds.</desc>

    <defs>
        <linearGradient id="scrim-stage" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#282936" />
            <stop offset="0.5" stop-color="#171820" />
            <stop offset="1" stop-color="#0b0c12" />
        </linearGradient>

        <radialGradient id="scrim-stage-glow" cx="50%" cy="42%" r="62%">
            <stop offset="0" stop-color="#f0008c" stop-opacity="0.24" />
            <stop offset="0.52" stop-color="#b9006c" stop-opacity="0.08" />
            <stop offset="1" stop-color="#090a10" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="scrim-rod" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6f3f5" />
            <stop offset="0.42" stop-color="#b8b2ba" />
            <stop offset="0.56" stop-color="#6e6973" />
            <stop offset="1" stop-color="#272832" />
        </linearGradient>

        <linearGradient id="scrim-fabric" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#c8c5cb" />
            <stop offset="0.08" stop-color="#f6f4f2" />
            <stop offset="0.2" stop-color="#d7d3d5" />
            <stop offset="0.33" stop-color="#fffef9" />
            <stop offset="0.47" stop-color="#dedadd" />
            <stop offset="0.5" stop-color="#c9c5ca" />
            <stop offset="0.53" stop-color="#e8e4e4" />
            <stop offset="0.68" stop-color="#fffefa" />
            <stop offset="0.82" stop-color="#d6d2d4" />
            <stop offset="0.93" stop-color="#f4f2ef" />
            <stop offset="1" stop-color="#bbb8c0" />
        </linearGradient>

        <linearGradient id="scrim-fabric-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.72" />
            <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.16" />
            <stop offset="0.78" stop-color="#817b85" stop-opacity="0.08" />
            <stop offset="1" stop-color="#4b4752" stop-opacity="0.3" />
        </linearGradient>

        <linearGradient id="scrim-left-fold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#696572" stop-opacity="0.38" />
            <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.04" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.5" />
        </linearGradient>

        <linearGradient id="scrim-right-fold" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0" stop-color="#696572" stop-opacity="0.38" />
            <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.04" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.5" />
        </linearGradient>

        <linearGradient id="scrim-bottom-shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#45414c" stop-opacity="0" />
            <stop offset="1" stop-color="#332f3a" stop-opacity="0.28" />
        </linearGradient>

        <filter id="scrim-curtain-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.52" />
        </filter>

        <filter id="scrim-logo-glow" x="-35%" y="-45%" width="170%" height="190%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="22" />
        </filter>

        <filter id="scrim-ambient-blur" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="34" />
        </filter>

        <clipPath id="scrim-curtain-clip">
            <path d="M169 178 C253 154 353 146 512 146 C671 146 771 154 855 178 L892 821 C818 843 746 853 676 846 C616 840 562 833 512 846 C462 833 408 840 348 846 C278 853 206 843 132 821 Z" />
        </clipPath>
    </defs>

    <!-- Stage tile -->
    <rect x="24" y="24" width="976" height="976" rx="222" fill="url(#scrim-stage)" />
    <rect x="24" y="24" width="976" height="976" rx="222" fill="url(#scrim-stage-glow)" />
    <ellipse cx="512" cy="879" rx="330" ry="60" fill="#000000" opacity="0.42" filter="url(#scrim-ambient-blur)" />

    <!-- Curtain rail and end caps -->
    <g filter="url(#scrim-curtain-shadow)">
        <rect x="132" y="119" width="760" height="48" rx="24" fill="url(#scrim-rod)" />
        <circle cx="127" cy="143" r="34" fill="#dedade" />
        <circle cx="897" cy="143" r="34" fill="#dedade" />
        <circle cx="127" cy="143" r="19" fill="#77727c" />
        <circle cx="897" cy="143" r="19" fill="#77727c" />
    </g>

    <!-- Closed white scrim -->
    <g filter="url(#scrim-curtain-shadow)">
        <path d="M169 178 C253 154 353 146 512 146 C671 146 771 154 855 178 L892 821 C818 843 746 853 676 846 C616 840 562 833 512 846 C462 833 408 840 348 846 C278 853 206 843 132 821 Z" fill="url(#scrim-fabric)" />
        <path d="M169 178 C253 154 353 146 512 146 C671 146 771 154 855 178 L892 821 C818 843 746 853 676 846 C616 840 562 833 512 846 C462 833 408 840 348 846 C278 853 206 843 132 821 Z" fill="url(#scrim-fabric-light)" />
    </g>

    <g clip-path="url(#scrim-curtain-clip)">
        <!-- Gathered top -->
        <path d="M120 172 C163 223 205 230 248 169 C283 225 329 230 370 158 C407 223 461 226 512 151 C563 226 617 223 654 158 C695 230 741 225 776 169 C819 230 861 223 904 172 L904 273 L120 273 Z" fill="#ffffff" opacity="0.36" />

        <!-- Projection bloom behind the mark -->
        <rect x="268" y="366" width="488" height="366" rx="104" fill="#f0008c" opacity="0.28" filter="url(#scrim-logo-glow)" />

        <!-- FreeShow logo, projected in the original palette -->
        <g opacity="0.96">
            <rect x="272" y="374" width="480" height="360" rx="74" fill="#f0008c" />
            <rect x="332" y="434" width="360" height="240" rx="48" fill="#b9006c" />
            <rect x="392" y="494" width="240" height="120" rx="30" fill="#202129" />
        </g>

        <!-- Long fabric folds pass over the projection so it reads as light on cloth -->
        <path d="M130 170 C196 214 193 393 172 849 L282 849 C256 514 253 271 292 157 Z" fill="url(#scrim-left-fold)" opacity="0.72" />
        <path d="M286 158 C344 215 343 425 321 850 L423 850 C398 489 400 247 435 150 Z" fill="url(#scrim-left-fold)" opacity="0.48" />
        <path d="M436 149 C485 215 487 459 471 850 L512 846 L553 850 C537 459 539 215 588 149 C557 164 535 162 512 146 C489 162 467 164 436 149 Z" fill="#726d77" opacity="0.17" />
        <path d="M589 150 C624 247 626 489 601 850 L703 850 C681 425 680 215 738 158 Z" fill="url(#scrim-right-fold)" opacity="0.48" />
        <path d="M732 157 C771 271 768 514 742 849 L852 849 C831 393 828 214 894 170 Z" fill="url(#scrim-right-fold)" opacity="0.72" />

        <!-- Fine highlight ridges -->
        <path d="M245 174 C221 360 228 604 237 829" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.25" />
        <path d="M380 161 C363 352 368 607 377 838" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.27" />
        <path d="M644 161 C661 352 656 607 647 838" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.27" />
        <path d="M779 174 C803 360 796 604 787 829" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.25" />

        <!-- Weighted lower hem -->
        <rect x="112" y="748" width="800" height="112" fill="url(#scrim-bottom-shade)" />
        <path d="M128 805 C204 827 278 838 348 831 C408 825 462 818 512 831 C562 818 616 825 676 831 C746 838 820 827 896 805" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.24" />
    </g>

    <!-- Center seam and subtle top sheen -->
    <path d="M512 151 C503 331 504 612 512 844" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.42" />
    <path d="M182 190 C333 164 691 164 842 190" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.32" />

    <!-- Inner rim keeps the icon crisp against light home-screen backgrounds -->
    <rect x="24" y="24" width="976" height="976" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />
</svg>
